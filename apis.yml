aid: bit
name: Bit
description: >-
  Bit (teambit) is the platform for the modular web — a build system and cloud
  for component-driven development. Bit lets teams create, version, and share
  reusable components as standard npm packages across projects and frameworks
  (React, Vue, Angular, Node.js, Next.js and more), with independent build,
  test, and CI/CD per component. Every Bit feature is API-first: an aspect-based
  programmatic API plus a GraphQL API power the CLI, the web UI, and Bit Cloud.
  Bit ships a built-in Model Context Protocol (MCP) server and a published
  Claude Agent Skill so AI agents can intelligently create and reuse components
  without duplication. Backed by Insight Partners.
